name: Build Attack On Titan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Project
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/android-tools/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android Components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Android Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android Paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate Godot Project
        run: |
          godot --headless --editor --path . --quit

      - name: Check Android Export Preset
        run: |
          test -f export_presets.cfg
          grep -q 'name="Android"' export_presets.cfg
          echo "Android export preset found."

      - name: Export APK
        id: export
        continue-on-error: true
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/AttackOnTitan.apk 2>&1 | tee export-log.txt
          test -f build/AttackOnTitan.apk

      - name: Upload Export Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Export-Log
          path: export-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Attack-On-Titan-APK
          path: build/AttackOnTitan.apk
          if-no-files-found: error

      - name: Fail if APK Export Failed
        if: steps.export.outcome != 'success'
        run: |
          echo "APK export failed. Download the Godot-Export-Log artifact for details."
          exit 1
